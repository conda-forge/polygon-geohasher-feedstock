{% set name = "polygon-geohasher" %}
{% set version = "0.0.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz"
  sha256: 3c7eb95e3ee85028bf2337a17a3c61ca3088d588b57752bb2bf3b5c67690a14e

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python

  run:
    - python
    - python-geohash
    - shapely

test:
  imports:
    - polygon_geohasher
    - tests

about:
  home: "https://github.com/Bonsanto/polygon-geohasher"
  license: "MIT"
  license_family: "MIT"
  license_file: "LICENSE"
  summary: "Wrapper over Shapely that returns the set of geohashes that form a Polygon"
  doc_url: "https://pypi.org/project/polygon-geohasher/"
  dev_url: "https://github.com/Bonsanto/polygon-geohasher"

extra:
  recipe-maintainers:
    - mxr-conda
    - mwilson8
    - rluria14
    - benhuff
